<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Resume</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<p class="page-title">✍️ Create Resume</p>
<div class="container" style="max-width:600px;">
{% if saved %}<p class="success">✅ Resume saved successfully!</p>{% endif %}
<form method="POST">
<textarea name="content" rows="12" placeholder="Write your resume here..." style="font-family: monospace;">{{ content }}</textarea>
<button class="full green">Save Resume</button>
</form>
<div style="text-align:center; margin-top:18px;">
<a href="/dashboard" style="color:#2563eb; font-size:15px;">← Back to Dashboard</a>
</div>
</div>
</body>
</html>
