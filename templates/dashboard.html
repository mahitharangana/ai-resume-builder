<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - AI Resume Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background:#f9f9f9; margin:0; padding:0; }
        .navbar { background:#7c3aed; color:#fff; padding:14px 24px; font-size:18px; font-weight:bold; }
        .navbar a { text-decoration:none; margin-left:12px; }
        .container { max-width:900px; margin:30px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
        h2 { margin-top:0; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-grid .full { grid-column:1 / -1; }
        label.field-label { font-weight:600; margin-bottom:4px; display:block; }
        input, select, textarea, button { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
        textarea { resize:vertical; }
        button { background:#7c3aed; color:#fff; border:none; cursor:pointer; transition:0.2s; }
        button:hover { background:#5b21b6; }
        #skill-suggestions { cursor:pointer; }
        @media(max-width:700px){ .form-grid{ grid-template-columns:1fr; } }
    </style>
</head>
<body>

<div class="navbar">
    AI Resume Builder
    <span style="float:right; font-size:14px; font-weight:400;">
        <a href="/profile" style="color:rgba(255,255,255,0.9);">👤 Profile</a> |
        <a href="/history" style="color:rgba(255,255,255,0.9);">📋 History</a> |
        <a href="/logout" style="color:rgba(255,255,255,0.9);">Logout</a>
    </span>
</div>

<div class="container">
    <h2>Enter Your Resume Details</h2>
    <p style="color:#6b7280; font-size:13px; margin-bottom:18px;">
        Fields are pre-filled from your profile.
        <a href="/profile" style="color:#2563eb;">Edit profile →</a>
    </p>

    <form method="POST" class="form-grid" action="/generate_summary">
        <div>
            <label class="field-label">Full Name</label>
            <input name="name" placeholder="Full Name" value="{{ profile.name }}" required>
        </div>
        <div>
            <label class="field-label">Phone</label>
            <input name="phone" placeholder="Phone" value="{{ profile.phone }}">
        </div>
        <div>
            <label class="field-label">Email</label>
            <input name="email" placeholder="Email" value="{{ profile.email }}">
        </div>
        <div>
            <label class="field-label">Job Role</label>
            <select name="job">
                {% for role in [
                    "Data Scientist", "Data Analyst", "Web Developer",
                    "Frontend Developer", "Backend Developer", "Full Stack Developer",
                    "AI Engineer", "Machine Learning Engineer",
                    "Cloud Engineer", "DevOps Engineer",
                    "Cybersecurity Analyst", "Mobile App Developer",
                    "Software Engineer"
                ] %}
                    <option value="{{ role }}" {% if profile.job == role %}selected{% endif %}>{{ role }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="full">
            <label class="field-label">Skills (comma separated)</label>
            <textarea name="skills" rows="3" placeholder="Skills">{{ profile.skills }}</textarea>
            <div id="skill-suggestions" style="margin-top:6px; font-size:13px; color:#6b7280;"></div>
        </div>

        <div class="full">
            <label class="field-label">Experience</label>
            <textarea name="experience" rows="4" placeholder="Experience">{{ profile.experience }}</textarea>
        </div>

        <div class="full">
            <label class="field-label">Projects</label>
            <textarea name="projects" rows="4" placeholder="Projects">{{ profile.projects }}</textarea>
        </div>

        <div class="full">
            <label class="field-label">Education</label>
            <textarea name="education" rows="3" placeholder="Education">{{ profile.education }}</textarea>
        </div>

        <div class="full">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <label class="field-label">Professional Summary</label>
                <button type="button" id="gen-btn" onclick="generateSummary()" style="width:auto; padding:6px 14px; font-size:13px;">
                    ✨ AI Generate
                </button>
            </div>
            <textarea id="summary-box" name="summary" rows="4" placeholder="Write your summary or click ✨ AI Generate...">{{ profile.summary }}</textarea>
        </div>

        <button class="full" style="margin-top:10px;">🚀 Generate Resume</button>
    </form>
</div>

<script>
function generateSummary() {
    const name = document.querySelector('input[name="name"]').value.trim();
    const job = document.querySelector('select[name="job"]').value;
    const skills = document.querySelector('textarea[name="skills"]').value.trim();
    const experience = document.querySelector('textarea[name="experience"]').value.trim();
    const projects = document.querySelector('textarea[name="projects"]').value.trim();
    const education = document.querySelector('textarea[name="education"]').value.trim();

    if (!name || !skills) {
        alert("Please fill in at least your Name and Skills first!");
        return;
    }

    const btn = document.getElementById("gen-btn");
    const box = document.getElementById("summary-box");
    btn.innerText = "⏳ Generating...";
    btn.disabled = true;
    box.value = "";

    fetch("/generate_summary", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `name=${encodeURIComponent(name)}&job=${encodeURIComponent(job)}&skills=${encodeURIComponent(skills)}&experience=${encodeURIComponent(experience)}&projects=${encodeURIComponent(projects)}&education=${encodeURIComponent(education)}`
    })
    .then(res => res.json())
    .then(data => {
        box.value = data.summary;
        btn.innerText = "✨ AI Generate";
        btn.disabled = false;
    })
    .catch(err => {
        box.value = "❌ Error: " + err.message;
        btn.innerText = "✨ AI Generate";
        btn.disabled = false;
    });
}

// Skill suggestions
const jobSelect = document.querySelector('select[name="job"]');
const skillBox = document.querySelector('textarea[name="skills"]');
const suggestionDiv = document.getElementById("skill-suggestions");

jobSelect.addEventListener("change", () => {
    fetch("/get_skills?role=" + encodeURIComponent(jobSelect.value))
    .then(res => res.json())
    .then(data => {
        suggestionDiv.innerHTML = data.skills.length ? "Suggested: " + data.skills.join(", ") : "";
    });
});

suggestionDiv.addEventListener("click", () => {
    skillBox.value = suggestionDiv.innerText.replace("Suggested: ", "");
});
</script>

</body>
</html>
